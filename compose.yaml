services:

  db:
    image: postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    mem_limit: 512m
    cpus: 0.50
    env_file:
      - postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
    image: ops-status-board:local
    mem_limit: 512m
    cpus: 0.50
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  migrate:
    profiles: ["maintenance"]
    build:
      context: .
    image: ops-status-board:local
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      APP_VERSION: ${APP_VERSION}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

volumes:
  postgres-data: