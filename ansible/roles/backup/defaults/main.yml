---
ops_backup_dir: /var/backups/ops-status-board
ops_backup_prefix: ops-status-board
ops_backup_retention_count: 7

ops_backup_s3_bucket: ""
ops_backup_s3_prefix: postgresql
ops_backup_aws_region: ""
ops_backup_kms_key_id: ""

ops_backup_script: /usr/local/sbin/ops-status-board-backup
ops_backup_lock_file: /run/lock/ops-status-board-backup.lock
ops_backup_container_temp_file: /tmp/ops-status-board-backup.dump

ops_backup_service_name: ops-status-board-backup.service
ops_backup_timer_name: ops-status-board-backup.timer
ops_backup_on_boot_delay: 10min
ops_backup_interval: 24h
