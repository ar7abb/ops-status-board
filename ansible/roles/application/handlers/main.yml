---
- name: Pull immutable application and observability images
  ansible.builtin.command: >
    docker compose -f {{ ops_compose_file }} pull
    app migrate{% if ops_observability_enabled | bool %} prometheus grafana node-exporter postgres-exporter{% endif %}
  changed_when: false
  listen: deploy ops status board

- name: Apply outstanding database migrations
  ansible.builtin.command: docker compose -f {{ ops_compose_file }} run --rm migrate
  changed_when: false
  listen: deploy ops status board

- name: Start the Ops Status Board stack
  ansible.builtin.command: >
    docker compose -f {{ ops_compose_file }} up
    --detach --wait app{% if ops_observability_enabled | bool %} prometheus grafana node-exporter postgres-exporter{% endif %}
  changed_when: false
  listen: deploy ops status board
