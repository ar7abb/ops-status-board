---
- name: Deploy the Ops Status Board through AWS Systems Manager
  hosts: ops_servers
  become: true
  gather_facts: true

  vars:
    ops_manage_ssh: false
    ops_manage_host_firewall: false
    ops_require_https_package_sources: true
    ops_observability_enabled: false
    ops_postgres_memory_limit: 320m
    ops_application_memory_limit: 384m
    ops_cloudwatch_enabled: true
    ops_cloudwatch_region: eu-north-1
    ops_cloudwatch_metrics_interval_seconds: 300
    ops_cloudwatch_access_log_group: /ops-status-board/lab/nginx/access
    ops_cloudwatch_error_log_group: /ops-status-board/lab/nginx/error
    ops_backup_s3_bucket: "{{ lookup('env', 'OPS_BACKUP_S3_BUCKET') }}"
    ops_backup_aws_region: eu-north-1
    ops_backup_kms_key_id: alias/ops-status-board-lab-backups

  roles:
    - base
    - security
    - docker
    - runtime_secrets
    - application
    - backup
    - nginx
    - cloudwatch
