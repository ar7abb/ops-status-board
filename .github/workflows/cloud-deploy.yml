name: Cloud deployment identity check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-aws-identity:
    name: Verify protected AWS identity
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
    steps:
      - name: Prove a wrong-audience token is rejected
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=not-sts.amazonaws.com")"
          invalid_token="$(printf '%s' "$response" | jq --raw-output '.value')"

          set +e
          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name denied-audience-check \
            --web-identity-token "$invalid_token" \
            >/dev/null 2>/tmp/oidc-denied.txt
          denied_status="$?"
          set -e

          rm -f /tmp/oidc-denied.txt
          test "$denied_status" -ne 0
          echo "Wrong-audience token was rejected as expected."

      - name: Inspect safe valid-token claims
        run: |
          response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          oidc_token="$(printf '%s' "$response" | jq --raw-output '.value')"

          OIDC_TOKEN="$oidc_token" python3 - <<'PY'
          import base64
          import json
          import os

          encoded_payload = os.environ["OIDC_TOKEN"].split(".")[1]
          encoded_payload += "=" * (-len(encoded_payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(encoded_payload))

          for claim_name in ("aud", "sub"):
              claim_value = claims.get(claim_name)
              if not isinstance(claim_value, str):
                  raise SystemExit(f"Missing expected {claim_name} claim")
              print(f"{claim_name}={claim_value}")
          PY

          unset response oidc_token OIDC_TOKEN

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify temporary caller identity
        run: |
          aws sts get-caller-identity >/dev/null
          echo "Temporary AWS identity verified."

      - name: Verify the intended SSM target is online
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          test -n "$INSTANCE_ID"
          test "$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)" = "Online"
          echo "Intended SSM target is online."
