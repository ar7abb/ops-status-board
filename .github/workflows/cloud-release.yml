name: Protected cloud release

on:
  workflow_dispatch:
    inputs:
      image:
        description: Reviewed ghcr.io/ar7abb/ops-status-board@sha256 digest
        required: true
        type: string
      revision:
        description: Full source commit recorded on the reviewed image
        required: true
        type: string
      operation:
        description: Explicit operator intention; rollback is never automatic
        required: true
        type: choice
        options:
          - deploy
          - rollback
          - approved-invalid-digest-drill

permissions:
  contents: read

concurrency:
  group: production-cloud-release
  cancel-in-progress: false

jobs:
  release:
    name: Approved digest deployment or manual rollback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ""
      RELEASE_IMAGE: ${{ inputs.image }}
      RELEASE_REVISION: ${{ inputs.revision }}
      RELEASE_OPERATION: ${{ inputs.operation }}
    steps:
      - name: Check out reviewed deployment code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
      - name: Validate immutable inputs before obtaining AWS credentials
        run: python3 scripts/dispatch_cloud_release.py --validate-only
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: protected-cloud-release
      - name: Deploy through SSM and enforce the health gate
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: python3 scripts/dispatch_cloud_release.py
