name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Any action added in later tasks must be pinned to a full commit SHA.
# This workflow is read-only; it cannot publish or deploy anything.

jobs:
  trust-check:
    name: CI trust check
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm CI started
        run: echo "Read-only CI skeleton is active."
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --editable .
          python -m pip check
      - name: Run static checks
        run: |
          ruff check .
          ruff format --check .
          git diff --check
      - name: Run tests with coverage
        run: python -m pytest -q --cov=ops_status_board --cov-report=term-missing
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - name: Scan repository security
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan development dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: requirements-dev.txt
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-setup-trivy: "true"
  container:
    name: Container smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - name: Build application image
        run: docker build --tag ops-status-board:local .
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ops-status-board:local
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
      - name: Create CI-only Compose configuration
        run: |
          cat > .env <<'EOF'
          APP_ENVIRONMENT=ci
          APP_VERSION=ci
          DATABASE_URL=postgresql+psycopg://ops_status_board_ci:ci-test-password@db:5432/ops_status_board_ci
          ADMIN_API_TOKEN=ci-test-token
          LOG_LEVEL=INFO
          EOF
          cat > postgres.env <<'EOF'
          POSTGRES_DB=ops_status_board_ci
          POSTGRES_USER=ops_status_board_ci
          POSTGRES_PASSWORD=ci-test-password
          EOF
      - name: Start database and apply migrations
        run: |
          docker compose up --detach --wait db
          docker compose run --rm migrate
      - name: Start application and run smoke test
        run: |
          docker compose up --detach --wait app
          docker compose ps
          curl --fail --show-error --silent http://127.0.0.1:8000/health/ready
          test "$(curl --fail --show-error --silent http://127.0.0.1:8000/api/incidents)" = "[]"
      - name: Show Compose logs on failure
        if: failure()
        run: |
          if [ -f .env ] && [ -f postgres.env ]; then
            docker compose logs --no-color
          fi
      - name: Clean up Compose resources
        if: always()
        run: |
          if [ -f .env ] && [ -f postgres.env ]; then
            docker compose down --volumes --remove-orphans
          fi