name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Any action added in later tasks must be pinned to a full commit SHA.
# This workflow is read-only; it cannot publish or deploy anything.

jobs:
  trust-check:
    name: CI trust check
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm CI started
        run: echo "Read-only CI skeleton is active."
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --editable .
          python -m pip check
      - name: Run static checks
        run: |
          ruff check .
          ruff format --check .
          git diff --check
      - name: Run tests with coverage
        run: python -m pytest -q --cov=ops_status_board --cov-report=term-missing