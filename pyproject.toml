[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-status-board"
version = "0.1.0"
description = "An operations status and incident dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2,<1.0",
    "pydantic-settings>=2.14.2,<3.0",
    "uvicorn[standard]>=0.51.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1,<1.0",
    "pip-tools>=7.6.0,<8.0",
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.15.22,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.pip-tools]
allow-unsafe = true
emit-index-url = false
generate-hashes = true
strip-extras = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["ops_status_board"]

[tool.coverage.report]
show_missing = true
